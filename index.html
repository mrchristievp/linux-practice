$('#import-file').addEventListener('change',async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>4e6)throw Error('The progress file is too large.');const data=JSON.parse(await f.text());if(data.version!==1||!data.completed||!data.snapshots||!Array.isArray(data.quizHistory))throw Error('Choose a Linux Practice progress export.');for(const [key,snap]of Object.entries(data.snapshots)){if(!['sandbox',...TOPICS.flatMap(t=>t.tasks.map(x=>x.id))].includes(key)||!snap.fs||typeof snap.cwd!=='string'||!Array.isArray(snap.history)||!Array.isArray(snap.events))throw Error('Invalid practice filesystem.');for(const [path,node]of Object.entries(snap.fs))if(!path.startsWith('/')||!['d','f'].includes(node.type)||!Number.isInteger(node.mode)||node.mode<0||node.mode>511||typeof node.owner!=='string'||node.type==='f'&&typeof node.text!=='string')throw Error('Invalid practice file.');if(snap.fs[snap.cwd]?.type!=='d'||snap.fs[HOME]?.type!=='d')throw Error('Invalid starting directory.');}if(!confirm('Replace progress in this browser with the imported file?'))return;state={...state,completed:data.completed,snapshots:data.snapshots,transcripts:data.transcripts||{},quizHistory:data.quizHistory};save();render();toast('Progress restored.');}catch(err){toast('Import failed: '+err.message);}finally{e.target.value='';}});
$('#close-editor').addEventListener('click',()=>$('#editor').close());$('#close-reference').addEventListener('click',()=>$('#reference-dialog').close());render();
</script></body></html>
